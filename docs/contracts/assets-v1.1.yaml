  "functions": [
    {
      "name": "visit_resources",
      "signature": "ST_Result visit_resources(ST_StringView owner_id, ST_StringView type_name, ST_AssetResourceVisitorV1 visitor, void* user_data)",
      "since": "1.0",
      "status": "stable",
      "summary": {
        "en": "Visit a snapshot of resources of one qualified type.",
        "de": "Snapshot der Ressourcen eines qualifizierten Typs besuchen."
      },
      "threading": {
        "en": "Synchronous on the calling thread; do not call concurrently unless stated otherwise.",
        "de": "Synchron auf dem aufrufenden Thread; nicht gleichzeitig aufrufen, sofern nicht anders angegeben."
      },
      "ownership": {
        "en": "Input is borrowed for the duration of the call; output ownership is stated per parameter.",
        "de": "Eingaben sind für die Aufrufdauer geliehen; Output-Ownership steht am jeweiligen Parameter."
      },
      "sideEffects": {
        "en": "No side effect beyond the described operation.",
        "de": "Keine Seiteneffekte außerhalb der beschriebenen Operation."
      },
      "permission": "shroudtopia.assets.read",
      "parameters": [
        {
          "name": "owner_id",
          "type": "ST_StringView",
          "description": {
            "en": "Calling owner.",
            "de": "Aufrufender Owner."
          },
          "since": "1.0",
          "direction": "in",
          "required": true
        },
        {
          "name": "type_name",
          "type": "ST_StringView",
          "description": {
            "en": "Qualified resource type.",
            "de": "Qualifizierter Ressourcentyp."
          },
          "since": "1.0",
          "direction": "in",
          "required": true
        },
        {
          "name": "visitor",
          "type": "ST_AssetResourceVisitorV1",
          "description": {
            "en": "Visitor callback.",
            "de": "Visitor-Callback."
          },
          "since": "1.0",
          "direction": "in",
          "required": true
        },
        {
          "name": "user_data",
          "type": "void*",
          "description": {
            "en": "Opaque visitor context.",
            "de": "Opaker Visitor-Kontext."
          },
          "since": "1.0",
          "direction": "in",
          "required": true
        }
      ],
      "results": [
        {
          "code": "ST_RESULT_OK",
          "description": {
            "en": "The operation completed.",
            "de": "Die Operation wurde abgeschlossen."
          }
        },
        {
          "code": "ST_RESULT_INVALID_ARGUMENT",
          "description": {
            "en": "A pointer, size, identifier, descriptor, or value is invalid.",
            "de": "Ein Pointer, eine Größe, ID, Beschreibung oder ein Wert ist ungültig."
          }
        },
        {
          "code": "ST_RESULT_PERMISSION_DENIED",
          "description": {
            "en": "The owner lacks the required permission.",
            "de": "Dem Owner fehlt die erforderliche Berechtigung."
          }
        },
        {
          "code": "ST_RESULT_INTERNAL_ERROR",
          "description": {
            "en": "The host could not complete the operation.",
            "de": "Der Host konnte die Operation nicht abschließen."
          }
        }
      ],
      "example": "// Initialize owner_id, type_name, visitor, user_data according to the parameter table.\nconst ST_Result status = api->visit_resources(owner_id, type_name, visitor, user_data);\nif (status != ST_RESULT_OK) {\n    // Handle the specific documented result.\n    return status;\n}"
    },
