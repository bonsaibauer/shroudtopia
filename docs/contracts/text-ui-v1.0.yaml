  "functions": [
    {
      "name": "create",
      "signature": "ST_Result create(ST_StringView owner, const ST_TextWindowDescriptorV1* descriptor, ST_TextWindow* window)",
      "since": "1.0",
      "status": "stable",
      "summary": {
        "en": "Begin asynchronous native window creation.",
        "de": "Asynchrone Erstellung eines nativen Fensters beginnen."
      },
      "threading": {
        "en": "Synchronous on the calling thread; do not call concurrently unless stated otherwise.",
        "de": "Synchron auf dem aufrufenden Thread; nicht gleichzeitig aufrufen, sofern nicht anders angegeben."
      },
      "ownership": {
        "en": "Input is borrowed for the duration of the call; output ownership is stated per parameter.",
        "de": "Eingaben sind für die Aufrufdauer geliehen; Output-Ownership steht am jeweiligen Parameter."
      },
      "sideEffects": {
        "en": "No side effect beyond the described operation.",
        "de": "Keine Seiteneffekte außerhalb der beschriebenen Operation."
      },
      "permission": null,
      "parameters": [
        {
          "name": "owner",
          "type": "ST_StringView",
          "description": {
            "en": "Window owner.",
            "de": "Fenster-Owner."
          },
          "since": "1.0",
          "direction": "in",
          "required": true
        },
        {
          "name": "descriptor",
          "type": "const ST_TextWindowDescriptorV1*",
          "description": {
            "en": "Window and tabs.",
            "de": "Fenster und Tabs."
          },
          "since": "1.0",
          "direction": "in",
          "required": true
        },
        {
          "name": "window",
          "type": "ST_TextWindow*",
          "description": {
            "en": "Receives window handle.",
            "de": "Empfängt das Fenster-Handle."
          },
          "since": "1.0",
          "direction": "out",
          "required": true
        }
      ],
      "results": [
        {
          "code": "ST_RESULT_OK",
          "description": {
            "en": "The operation completed.",
            "de": "Die Operation wurde abgeschlossen."
          }
        },
        {
          "code": "ST_RESULT_INVALID_ARGUMENT",
          "description": {
            "en": "A pointer, size, identifier, descriptor, or value is invalid.",
            "de": "Ein Pointer, eine Größe, ID, Beschreibung oder ein Wert ist ungültig."
          }
        },
        {
          "code": "ST_RESULT_PERMISSION_DENIED",
          "description": {
            "en": "The owner lacks the required permission.",
            "de": "Dem Owner fehlt die erforderliche Berechtigung."
          }
        },
        {
          "code": "ST_RESULT_INTERNAL_ERROR",
          "description": {
            "en": "The host could not complete the operation.",
            "de": "Der Host konnte die Operation nicht abschließen."
          }
        }
      ],
      "example": "// Initialize owner, descriptor, window according to the parameter table.\nconst ST_Result status = api->create(owner, descriptor, window);\nif (status != ST_RESULT_OK) {\n    // Handle the specific documented result.\n    return status;\n}"
    },
