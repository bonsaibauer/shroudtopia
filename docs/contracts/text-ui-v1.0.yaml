          "description": {
            "en": "Creation pending.",
            "de": "Erstellung ausstehend."
          },
          "since": "1.0"
        },
        {
          "name": "ST_TEXT_READY",
          "type": "1",
          "description": {
            "en": "Window ready.",
            "de": "Fenster bereit."
          },
          "since": "1.0"
