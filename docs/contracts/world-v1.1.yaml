  "functions": [
    {
      "name": "query_entities",
      "signature": "ST_Result query_entities(ST_StringView owner_id, const ST_AabbV1* region, ST_EntitySnapshotV1* entities, size_t capacity, size_t* required_count)",
      "since": "1.0",
      "status": "experimental",
      "summary": {
        "en": "Return complete entity snapshots in a half-open region.",
        "de": "Vollständige Entity-Snapshots in einer halboffenen Region liefern."
      },
      "threading": {
        "en": "Synchronous on the calling thread; do not call concurrently unless stated otherwise.",
        "de": "Synchron auf dem aufrufenden Thread; nicht gleichzeitig aufrufen, sofern nicht anders angegeben."
      },
      "ownership": {
        "en": "Input is borrowed for the duration of the call; output ownership is stated per parameter.",
        "de": "Eingaben sind für die Aufrufdauer geliehen; Output-Ownership steht am jeweiligen Parameter."
      },
      "sideEffects": {
        "en": "No side effect beyond the described operation.",
        "de": "Keine Seiteneffekte außerhalb der beschriebenen Operation."
      },
      "permission": "shroudtopia.world.entities.read",
      "parameters": [
        {
          "name": "owner_id",
          "type": "ST_StringView",
          "description": {
            "en": "Calling owner.",
            "de": "Aufrufender Owner."
          },
          "since": "1.0",
          "direction": "in",
          "required": true
        },
        {
          "name": "region",
          "type": "const ST_AabbV1*",
          "description": {
            "en": "Half-open world bounds.",
            "de": "Halboffene Weltgrenzen."
          },
          "since": "1.0",
          "direction": "in",
          "required": true
        },
        {
          "name": "entities",
          "type": "ST_EntitySnapshotV1*",
          "description": {
            "en": "Caller-owned initialized array.",
            "de": "Initialisiertes Array des Aufrufers."
          },
          "since": "1.0",
          "direction": "out",
          "required": false
        },
        {
          "name": "capacity",
          "type": "size_t",
          "description": {
            "en": "Array element capacity.",
            "de": "Elementkapazität des Arrays."
          },
          "since": "1.0",
          "direction": "in",
          "required": true
        },
        {
          "name": "required_count",
          "type": "size_t*",
          "description": {
            "en": "Receives required elements.",
            "de": "Empfängt benötigte Elemente."
          },
          "since": "1.0",
          "direction": "out",
          "required": true
        }
      ],
      "results": [
        {
          "code": "ST_RESULT_OK",
          "description": {
            "en": "The operation completed.",
            "de": "Die Operation wurde abgeschlossen."
          }
        },
        {
          "code": "ST_RESULT_INVALID_ARGUMENT",
          "description": {
            "en": "A pointer, size, identifier, descriptor, or value is invalid.",
            "de": "Ein Pointer, eine Größe, ID, Beschreibung oder ein Wert ist ungültig."
          }
        },
        {
          "code": "ST_RESULT_PERMISSION_DENIED",
          "description": {
            "en": "The owner lacks the required permission.",
            "de": "Dem Owner fehlt die erforderliche Berechtigung."
          }
        },
        {
          "code": "ST_RESULT_INTERNAL_ERROR",
          "description": {
            "en": "The host could not complete the operation.",
            "de": "Der Host konnte die Operation nicht abschließen."
          }
        }
      ],
      "example": "// Initialize owner_id, region, entities, capacity, required_count according to the parameter table.\nconst ST_Result status = api->query_entities(owner_id, region, entities, capacity, required_count);\nif (status != ST_RESULT_OK) {\n    // Handle the specific documented result.\n    return status;\n}"
    },
