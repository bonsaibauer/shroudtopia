  "functions": [
    {
      "name": "register_service",
      "signature": "ST_Result register_service(ST_StringView owner_id, const ST_ServiceDescriptor* descriptor, ST_Registration* registration)",
      "since": "1.0",
      "status": "stable",
      "summary": {
        "en": "Publish a versioned service provider.",
        "de": "Einen versionierten Service-Provider veröffentlichen."
      },
      "threading": {
        "en": "Synchronous on the calling thread; do not call concurrently unless stated otherwise.",
        "de": "Synchron auf dem aufrufenden Thread; nicht gleichzeitig aufrufen, sofern nicht anders angegeben."
      },
      "ownership": {
        "en": "Input is borrowed for the duration of the call; output ownership is stated per parameter.",
        "de": "Eingaben sind für die Aufrufdauer geliehen; Output-Ownership steht am jeweiligen Parameter."
      },
      "sideEffects": {
        "en": "Adds an owner-bound service registration.",
        "de": "Ändert die beschriebene Ressource."
      },
      "permission": null,
      "parameters": [
        {
          "name": "owner_id",
          "type": "ST_StringView",
          "description": {
            "en": "Stable mod owner ID.",
            "de": "Stabile Mod-Owner-ID."
          },
          "since": "1.0",
          "direction": "in",
          "required": true
        },
        {
          "name": "descriptor",
          "type": "const ST_ServiceDescriptor*",
          "description": {
            "en": "Initialized service description.",
            "de": "Initialisierte Service-Beschreibung."
          },
          "since": "1.0",
          "direction": "in",
          "required": true
        },
        {
          "name": "registration",
          "type": "ST_Registration*",
          "description": {
            "en": "Receives the release handle.",
            "de": "Empfängt das Release-Handle."
          },
          "since": "1.0",
          "direction": "out",
          "required": true
        }
      ],
      "results": [
        {
          "code": "ST_RESULT_OK",
          "description": {
            "en": "The operation completed.",
            "de": "Die Operation wurde abgeschlossen."
          }
        },
        {
          "code": "ST_RESULT_INVALID_ARGUMENT",
          "description": {
            "en": "A pointer, size, identifier, descriptor, or value is invalid.",
            "de": "Ein Pointer, eine Größe, ID, Beschreibung oder ein Wert ist ungültig."
          }
        },
        {
          "code": "ST_RESULT_PERMISSION_DENIED",
          "description": {
            "en": "The owner lacks the required permission.",
            "de": "Dem Owner fehlt die erforderliche Berechtigung."
          }
        },
        {
          "code": "ST_RESULT_INTERNAL_ERROR",
          "description": {
            "en": "The host could not complete the operation.",
            "de": "Der Host konnte die Operation nicht abschließen."
          }
        },
        {
          "code": "ST_RESULT_ALREADY_EXISTS",
          "description": {
            "en": "The contract and major version already have a provider.",
            "de": "Contract und Major-Version haben bereits einen Provider."
          }
        }
      ],
      "example": "// Initialize owner_id, descriptor, registration according to the parameter table.\nconst ST_Result status = api->register_service(owner_id, descriptor, registration);\nif (status != ST_RESULT_OK) {\n    // Handle the specific documented result.\n    return status;\n}"
    },
    {
