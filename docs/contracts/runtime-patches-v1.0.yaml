{
  "id": "shroudtopia.runtime.patches",
  "version": "1.0",
  "status": "stable",
  "header": "api/include/shroudtopia/api/runtime.h",
  "capability": "shroudtopia.runtime.patches",
  "provider": {
    "en": "Shroudtopia loader",
    "de": "Shroudtopia Loader"
  },
  "title": {
    "en": "Runtime Patch API",
    "de": "Runtime Patch API"
  },
  "summary": {
    "en": "Controlled signature-based direct patches and x64 detours.",
    "de": "Kontrollierte signaturbasierte direkte Patches und x64-Detours."
  },
  "types": [
    {
      "name": "ST_RuntimePatch",
      "kind": "handle",
      "description": {
        "en": "Opaque owner-bound patch handle.",
        "de": "Opakes Owner-gebundenes Patch-Handle."
      }
    },
    {
      "name": "ST_RuntimePatchKindV1",
      "kind": "enum",
      "description": {
        "en": "Patch application strategy.",
        "de": "Strategie zur Patch-Anwendung."
      },
      "values": [
        {
          "name": "ST_RUNTIME_PATCH_DIRECT",
          "type": "0",
          "description": {
            "en": "Direct replacement bytes.",
            "de": "Direkte Ersatzbytes."
          },
          "since": "1.0"
        },
        {
          "name": "ST_RUNTIME_PATCH_DETOUR",
          "type": "1",
          "description": {
            "en": "Near x64 detour.",
            "de": "Naher x64-Detour."
          },
          "since": "1.0"
        }
      ]
    },
    {
      "name": "ST_RuntimeRelocationKindV1",
      "kind": "enum",
      "description": {
        "en": "Supported payload relocation.",
        "de": "Unterstützte Payload-Relocation."
      },
      "values": [
        {
          "name": "ST_RUNTIME_RELOCATION_REL32_RETURN",
          "type": "1",
          "description": {
            "en": "Write a relative 32-bit return displacement.",
            "de": "Relative 32-Bit-Return-Distanz schreiben."
          },
          "since": "1.0"
        }
      ]
    },
    {
      "name": "ST_RuntimeRelocationV1",
