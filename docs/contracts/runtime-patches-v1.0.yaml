      "description": {
        "en": "Payload relocation instruction.",
        "de": "Payload-Relocation-Anweisung."
      },
      "fields": [
        {
          "name": "struct_size",
          "type": "size_t",
          "description": {
            "en": "Initialized structure byte size.",
            "de": "Initialisierte Strukturgröße in Byte."
          },
          "since": "1.0",
          "rules": {
            "en": "Set to sizeof(the structure).",
            "de": "Auf sizeof(der Struktur) setzen."
          }
        },
        {
          "name": "payload_offset",
          "type": "size_t",
          "description": {
            "en": "Offset within payload.",
            "de": "Offset innerhalb des Payloads."
          },
          "since": "1.0"
        },
        {
          "name": "kind",
          "type": "ST_RuntimeRelocationKindV1",
          "description": {
            "en": "Supported relocation kind.",
            "de": "Unterstützte Relocation-Art."
          },
          "since": "1.0"
        }
      ]
    },
    {
      "name": "ST_RuntimePatchDescriptorV1",
