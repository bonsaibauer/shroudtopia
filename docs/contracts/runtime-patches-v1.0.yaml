  "functions": [
    {
      "name": "create",
      "signature": "ST_Result create(ST_StringView owner_id, const ST_RuntimePatchDescriptorV1* descriptor, ST_RuntimePatch* patch)",
      "since": "1.0",
      "status": "stable",
      "summary": {
        "en": "Validate and create an inactive patch.",
        "de": "Einen inaktiven Patch validieren und erstellen."
      },
      "threading": {
        "en": "Synchronous on the calling thread; do not call concurrently unless stated otherwise.",
        "de": "Synchron auf dem aufrufenden Thread; nicht gleichzeitig aufrufen, sofern nicht anders angegeben."
      },
      "ownership": {
        "en": "Input is borrowed for the duration of the call; output ownership is stated per parameter.",
        "de": "Eingaben sind für die Aufrufdauer geliehen; Output-Ownership steht am jeweiligen Parameter."
      },
      "sideEffects": {
        "en": "No side effect beyond the described operation.",
        "de": "Keine Seiteneffekte außerhalb der beschriebenen Operation."
      },
      "permission": "shroudtopia.runtime.patches",
      "parameters": [
        {
          "name": "owner_id",
          "type": "ST_StringView",
          "description": {
            "en": "Patch owner.",
            "de": "Patch-Owner."
          },
          "since": "1.0",
          "direction": "in",
          "required": true
        },
        {
          "name": "descriptor",
          "type": "const ST_RuntimePatchDescriptorV1*",
          "description": {
            "en": "Complete patch definition.",
            "de": "Vollständige Patch-Definition."
          },
          "since": "1.0",
          "direction": "in",
          "required": true
        },
        {
          "name": "patch",
          "type": "ST_RuntimePatch*",
          "description": {
            "en": "Receives patch handle.",
            "de": "Empfängt das Patch-Handle."
          },
          "since": "1.0",
          "direction": "out",
          "required": true
        }
      ],
      "results": [
        {
          "code": "ST_RESULT_OK",
          "description": {
            "en": "The operation completed.",
            "de": "Die Operation wurde abgeschlossen."
          }
        },
        {
          "code": "ST_RESULT_INVALID_ARGUMENT",
          "description": {
            "en": "A pointer, size, identifier, descriptor, or value is invalid.",
            "de": "Ein Pointer, eine Größe, ID, Beschreibung oder ein Wert ist ungültig."
          }
        },
        {
          "code": "ST_RESULT_PERMISSION_DENIED",
          "description": {
            "en": "The owner lacks the required permission.",
            "de": "Dem Owner fehlt die erforderliche Berechtigung."
          }
        },
        {
          "code": "ST_RESULT_INTERNAL_ERROR",
          "description": {
            "en": "The host could not complete the operation.",
            "de": "Der Host konnte die Operation nicht abschließen."
          }
        }
      ],
      "example": "// Initialize owner_id, descriptor, patch according to the parameter table.\nconst ST_Result status = api->create(owner_id, descriptor, patch);\nif (status != ST_RESULT_OK) {\n    // Handle the specific documented result.\n    return status;\n}"
    },
