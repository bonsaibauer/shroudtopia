[book]
authors = ["Shroudtopia contributors"]
language = "en"
multilingual = false
src = ".build/en"
title = "Shroudtopia API Documentation"

[build]
build-dir = "../site/en"

[output.html]
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/bonsaibauer/shroudtopia"
site-url = "/shroudtopia/en/"
additional-css = ["theme/shroudtopia.css"]
additional-js = ["theme/generated/shroudtopia.js"]

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
