[book]
authors = ["Shroudtopia contributors"]
language = "de"
multilingual = false
src = "src"
title = "Shroudtopia Handbuch"

[build]
build-dir = "../site"

[output.html]
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/bonsaibauer/shroudtopia"
site-url = "/shroudtopia/"
additional-css = ["theme/shroudtopia.css"]

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
