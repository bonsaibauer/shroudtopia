[workspace]
resolver = "3"
members = [
    "crates/shroudtopia-assets",
]

[workspace.package]
edition = "2024"
version = "1.0.0"
authors = ["Shroudtopia contributors"]
license = "GPL-3.0-or-later"
rust-version = "1.88.0"

[workspace.dependencies]
serde_json = "1.0"
uuid = { version = "1.18.0", features = ["v4"] }

[profile.release]
panic = "abort"
lto = "thin"
