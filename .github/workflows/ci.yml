name: Build Shroudtopia

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build, test and package
        shell: pwsh
        run: |
          $refName = if ("${{ github.event_name }}" -eq "pull_request") { "${{ github.base_ref }}" } else { "${{ github.ref_name }}" }
          $refType = if ("${{ github.ref }}".StartsWith("refs/tags/")) { "tag" } else { "branch" }
          .\build.ps1 -BuildNumber "${{ github.run_number }}" -RefName $refName -RefType $refType
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: shroudtopia-${{ github.run_number }}
          path: build/shroudtopia-*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/shroudtopia-*.zip
          generate_release_notes: true
